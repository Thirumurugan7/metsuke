<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Code Editor</title>
    <!--
      The renderer loads no remote content, so everything is locked to self. The
      preview <webview> is a separate context and is not governed by this policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; script-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
