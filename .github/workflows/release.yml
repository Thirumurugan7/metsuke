name: Release

# Windows and Linux binaries cannot be produced on a Mac: node-pty is a native module
# and has to be compiled on the platform it targets. Each OS therefore builds its own
# installers here and uploads them to a single GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-pty needs a toolchain to compile against Electron's headers.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      # Deliberately without GH_TOKEN. electron-builder would otherwise create the
      # release itself and race the job below for it; here it only builds, and writes
      # the update metadata beside the installers.
      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # Compiled into the build. Unset in a fork or a local build, which is what
          # makes those collect nothing at all regardless of what a user consents to.
          METSUKE_TELEMETRY_ENDPOINT: ${{ secrets.METSUKE_TELEMETRY_ENDPOINT }}
          # Where the shipped app looks for updates. The repository is private, so this
          # points at the download endpoint rather than at GitHub: it authenticates
          # server-side, which is the only way to serve a private repo's assets without
          # putting a token inside the app.
          METSUKE_UPDATE_URL: ${{ secrets.METSUKE_UPDATE_URL }}

      # The .yml files are the update feed: latest-mac.yml, latest.yml and
      # latest-linux.yml are what electron-updater reads to decide whether anything is
      # newer. Without them in the release, every update check 404s and the app silently
      # never updates. The blockmaps make the download differential rather than a fresh
      # hundred megabytes. Each runner produces only its own platform's files, so most of
      # these patterns legitimately miss, which is why a miss is a warning.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
