name: Release

# Windows and Linux binaries cannot be produced on a Mac: node-pty is a native module
# and has to be compiled on the platform it targets. Each OS therefore builds its own
# installers here and uploads them to a single GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-pty needs a toolchain to compile against Electron's headers.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        # libfuse2 is what AppImage packaging needs; ubuntu-latest is 24.04, where the
        # package was renamed, so try both names rather than pinning to one release.
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      # Every command that can fail writes to step.log, and the step below turns the
      # tail of it into a ::error:: annotation. Annotations are readable from the API
      # without a token; job logs are not. Without this, a failure on a runner you
      # cannot log into reports only "Process completed with exit code 1", which is
      # true and useless.
      - name: Install dependencies
        shell: bash
        run: set -o pipefail && npm ci 2>&1 | tee -a step.log

      - name: Typecheck and test
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee -a step.log
          npm test 2>&1 | tee -a step.log

      # --publish never, and deliberately no GH_TOKEN. On a tag push electron-builder
      # publishes by default, so with a github provider it tries to create the release
      # itself, races the job below for it, and aborts outright when it finds no token.
      # It still writes latest-*.yml and the blockmaps, which is the part we actually
      # need: the release job attaches them.
      - name: Build installers
        shell: bash
        run: set -o pipefail && npm run ${{ matrix.script }} -- --publish never 2>&1 | tee -a step.log
        env:
          # Compiled into the build. Unset in a fork or a local build, which is what
          # makes those collect nothing at all regardless of what a user consents to.
          METSUKE_TELEMETRY_ENDPOINT: ${{ secrets.METSUKE_TELEMETRY_ENDPOINT }}

      # The reason this job failed, in a form readable without a token.
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          echo "--- last 40 lines on ${{ matrix.os }} ---"
          tail -n 40 step.log || echo "(no step.log: the failure was before any command ran)"
          {
            echo "### ${{ matrix.os }} failed"
            echo '```'
            tail -n 40 step.log 2>/dev/null || echo "(no step.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          msg=$(tail -n 12 step.log 2>/dev/null | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=${{ matrix.os }} build failed::${msg:-no output captured}"

      # The .yml files are the update feed: latest-mac.yml, latest.yml and
      # latest-linux.yml are what electron-updater reads to decide whether anything is
      # newer. Without them in the release, every update check 404s and the app silently
      # never updates. The blockmaps make the download differential rather than a fresh
      # hundred megabytes. Each runner produces only its own platform's files, so most of
      # these patterns legitimately miss, which is why a miss is a warning.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn

  release:
    needs: build
    # always(), so one platform failing does not withhold the others. Three separate
    # runners producing three separate installers should fail separately too: with a
    # plain needs: build, a Windows toolchain error meant nobody got the macOS build
    # either, which is the wrong trade when the failures are unrelated.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A release with no installers in it is worse than no release: the site would
      # stop falling back to the releases page and start offering nothing.
      - name: Fail if nothing built
        run: |
          found=$(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' \) | wc -l)
          echo "installers found: $found"
          test "$found" -gt 0

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
