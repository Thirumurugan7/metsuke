<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Metsuke telemetry</title>
    <style>
      /*
       * Dark-first, because the editor is, with a light mode selected rather than
       * inverted. Series colours are the validated categorical slots 1 and 2, stepped
       * per surface; text never wears a series colour.
       */
      :root {
        color-scheme: dark;
        --surface: #1a1a19;
        --raised: #232322;
        --line: #33332f;
        --text: #ffffff;
        --text-2: #c3c2b7;
        --text-3: #8b8a80;
        --series-1: #3987e5;
        --series-2: #d95926;
        --critical: #d03b3b;
        --good: #0ca30c;
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) {
          color-scheme: light;
          --surface: #fcfcfb;
          --raised: #ffffff;
          --line: #e4e3de;
          --text: #0b0b0b;
          --text-2: #52514e;
          --text-3: #77766f;
          --series-1: #2a78d6;
          --series-2: #eb6834;
        }
      }

      * { box-sizing: border-box; }
      body {
        background: var(--surface);
        color: var(--text);
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
        margin: 0;
        padding: 28px clamp(16px, 4vw, 44px) 64px;
      }
      h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
      h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; margin: 34px 0 12px; text-transform: uppercase; color: var(--text-2); }
      .head { align-items: baseline; display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 6px; }
      .sub { color: var(--text-3); font-size: 12.5px; }
      .range { margin-left: auto; display: flex; gap: 6px; }
      .range button {
        background: var(--raised); border: 1px solid var(--line); border-radius: 7px;
        color: var(--text-2); cursor: pointer; font: inherit; font-size: 12.5px; padding: 5px 11px;
      }
      .range button[aria-pressed='true'] { border-color: var(--series-1); color: var(--text); }

      /* -- stat tiles: the headline numbers are not charts -------------------- */
      .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); }
      .tile { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
      .tile .label { color: var(--text-2); font-size: 12px; }
      .tile .value { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-top: 4px; }
      .tile .foot { color: var(--text-3); font-size: 11.5px; margin-top: 2px; }

      .panel { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
      .grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }

      .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-2); margin-bottom: 10px; }
      .legend span { align-items: center; display: flex; gap: 6px; }
      .swatch { border-radius: 2px; height: 8px; width: 14px; }

      table { border-collapse: collapse; font-size: 13px; width: 100%; }
      th { color: var(--text-2); font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; text-align: left; text-transform: uppercase; }
      th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
      td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
      tbody tr:last-child td { border-bottom: none; }
      details summary { cursor: pointer; }
      pre { background: var(--surface); border-radius: 6px; font-family: var(--mono); font-size: 11.5px; margin: 6px 0 0; overflow-x: auto; padding: 8px 10px; color: var(--text-2); }

      .bar-row { align-items: center; display: grid; gap: 10px; grid-template-columns: 1fr 2fr auto; padding: 3px 0; }
      /* Both are spans inside a grid row, and an inline element ignores width and
         height: without display:block the fill renders as nothing at all. */
      .bar-track { background: color-mix(in srgb, var(--text) 10%, transparent); border-radius: 4px; display: block; height: 9px; overflow: hidden; }
      .bar-fill { background: var(--series-1); border-radius: 4px; display: block; height: 100%; }
      .bar-label { color: var(--text-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar-value { color: var(--text-2); font-family: var(--mono); font-size: 12px; }

      .empty { color: var(--text-3); font-size: 13px; padding: 10px 0; }
      .err { color: var(--critical); }
      .ok { color: var(--good); }
      svg { display: block; overflow: visible; width: 100%; }
      .tip { background: var(--raised); border: 1px solid var(--line); border-radius: 7px; color: var(--text); font-size: 12px; padding: 7px 9px; pointer-events: none; position: fixed; z-index: 9; box-shadow: 0 8px 24px #0006; }
      .tip b { display: block; margin-bottom: 3px; }
      .tip i { color: var(--text-2); font-style: normal; }
      .foot-note { color: var(--text-3); font-size: 12px; margin-top: 34px; max-width: 70ch; }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>Metsuke telemetry</h1>
      <span class="sub" id="scope">loading…</span>
      <div class="range" role="group" aria-label="Time range">
        <button data-days="7">7 days</button>
        <button data-days="30" aria-pressed="true">30 days</button>
        <button data-days="90">90 days</button>
      </div>
    </div>

    <div class="tiles" id="tiles"></div>

    <h2>Activity</h2>
    <div class="panel">
      <div class="legend">
        <span><i class="swatch" style="background: var(--series-1)"></i> Active installs</span>
        <span><i class="swatch" style="background: var(--series-2)"></i> Launches</span>
      </div>
      <div id="activity"></div>
      <details style="margin-top: 10px">
        <summary class="sub">Table view</summary>
        <div id="activity-table"></div>
      </details>
    </div>

    <div class="grid2" style="margin-top: 14px">
      <div class="panel">
        <h2 style="margin-top: 0">Features, by installs that used them</h2>
        <div id="features"></div>
      </div>
      <div class="panel">
        <h2 style="margin-top: 0">Preview tools Claude reached for</h2>
        <div id="preview-tools"></div>
      </div>
    </div>

    <div class="grid2" style="margin-top: 14px">
      <div class="panel">
        <h2 style="margin-top: 0">Versions</h2>
        <div id="versions"></div>
      </div>
      <div class="panel">
        <h2 style="margin-top: 0">Platforms</h2>
        <div id="platforms"></div>
      </div>
    </div>

    <h2>What is breaking</h2>
    <div class="panel" id="errors"></div>

    <p class="foot-note" id="privacy"></p>

    <script type="module">
      const fmt = (n) => (n == null ? '—' : new Intl.NumberFormat().format(n))
      const pct = (n) => (n == null ? '—' : `${Math.round(n * 100)}%`)
      const el = (id) => document.getElementById(id)

      let days = 30

      async function load() {
        const res = await fetch(`/api/overview?days=${days}`, { credentials: 'same-origin' })
        if (!res.ok) {
          el('scope').textContent = `could not load (${res.status})`
          return
        }
        render(await res.json())
      }

      function render(d) {
        const s = d.summary
        el('scope').textContent = `${fmt(s.installs)} installs seen · last ${d.days} days · ${d.retentionDays}-day retention`

        /* Stat tiles rather than charts: these are single numbers, and a single number
           in a chart is a number that has been made harder to read. */
        el('tiles').innerHTML = [
          tile('Installs', fmt(s.installs), `${fmt(s.newInstalls7d)} new this week`),
          tile('Active this week', fmt(s.installsActive7d), `${fmt(s.installsActive30d)} in 30 days`),
          tile('Launches this week', fmt(s.launches7d), ''),
          tile('Median session', s.medianSessionMinutes ? `${s.medianSessionMinutes} min` : '—', 'over 7 days'),
          tile('Had Claude Code', pct(s.claudeInstalledShare), 'of launches, 30 days'),
          tile('Installs hitting errors', fmt(s.installsWithErrors7d), `${fmt(s.errors7d)} errors this week`)
        ].join('')

        lineChart(el('activity'), d.activeByDay)
        el('activity-table').innerHTML = table(
          ['Day', 'Active installs', 'Launches'],
          d.activeByDay.map((r) => [r.day, fmt(r.installs), fmt(r.launches)])
        )

        bars(el('features'), d.features.map((f) => ({ label: f.feature.replace(/_/g, ' '), value: f.installs, note: `${fmt(f.uses)} uses` })))
        bars(el('preview-tools'), d.previewTools.map((t) => ({ label: t.tool, value: t.uses, note: `${fmt(t.installs)} installs` })))
        bars(el('versions'), d.versions.map((v) => ({ label: v.value, value: v.installs, note: '' })))
        bars(el('platforms'), d.platforms.map((p) => ({ label: p.value, value: p.installs, note: '' })))

        errors(el('errors'), d.errors)

        el('privacy').textContent =
          'Every row here is an anonymous install id, a version and a count. There are no addresses, no paths, no project names and nothing anyone wrote, because the app never sends them. Events older than the retention window are deleted; install rows are kept, being a random id and two timestamps.'
      }

      const tile = (label, value, foot) =>
        `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div><div class="foot">${foot}</div></div>`

      const table = (head, rows) =>
        `<table><thead><tr>${head.map((h, i) => `<th${i ? ' class="num"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows
          .map((r) => `<tr>${r.map((c, i) => `<td${i ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`)
          .join('')}</tbody></table>`

      /* Ranked magnitude with a category per row: horizontal bars, one series, so no
         legend. Every bar is directly labelled, which is what makes it readable. */
      function bars(node, rows) {
        if (rows.length === 0) return void (node.innerHTML = '<p class="empty">Nothing yet.</p>')
        const max = Math.max(...rows.map((r) => r.value), 1)
        node.innerHTML = rows
          .map(
            (r) => `<div class="bar-row">
              <span class="bar-label" title="${r.label}">${r.label}</span>
              <span class="bar-track"><span class="bar-fill" style="width: ${Math.max(2, (r.value / max) * 100)}%"></span></span>
              <span class="bar-value">${fmt(r.value)}${r.note ? ` <i style="opacity:.6">${r.note}</i>` : ''}</span>
            </div>`
          )
          .join('')
      }

      /* Change over time, two series on one axis: both are counts, so a second axis
         would be a lie about their relationship. */
      function lineChart(node, rows) {
        if (rows.length < 2) return void (node.innerHTML = '<p class="empty">Not enough days yet to draw a line.</p>')

        const W = 900, H = 220, P = { t: 10, r: 14, b: 24, l: 40 }
        const max = Math.max(...rows.flatMap((r) => [r.installs, r.launches]), 1)
        const x = (i) => P.l + (i * (W - P.l - P.r)) / (rows.length - 1)
        const y = (v) => H - P.b - (v / max) * (H - P.t - P.b)
        const path = (key) => rows.map((r, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join(' ')

        const ticks = [0, Math.round(max / 2), max]
        node.innerHTML = `
          <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Active installs and launches per day">
            ${ticks
              .map(
                (t) => `<g><line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>
                  <text x="${P.l - 8}" y="${y(t) + 4}" fill="var(--text-3)" font-size="11" text-anchor="end">${t}</text></g>`
              )
              .join('')}
            <path d="${path('launches')}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="${path('installs')}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            ${rows
              .map(
                (r, i) => `<g class="pt" data-i="${i}">
                  <circle cx="${x(i)}" cy="${y(r.launches)}" r="3.5" fill="var(--series-2)" stroke="var(--raised)" stroke-width="2"/>
                  <circle cx="${x(i)}" cy="${y(r.installs)}" r="3.5" fill="var(--series-1)" stroke="var(--raised)" stroke-width="2"/>
                  <rect x="${x(i) - 12}" y="${P.t}" width="24" height="${H - P.t - P.b}" fill="transparent"/>
                </g>`
              )
              .join('')}
            <text x="${P.l}" y="${H - 6}" fill="var(--text-3)" font-size="11">${rows[0].day}</text>
            <text x="${W - P.r}" y="${H - 6}" fill="var(--text-3)" font-size="11" text-anchor="end">${rows[rows.length - 1].day}</text>
          </svg>`

        // Hover is not a nicety on a line chart: without it the only readable values
        // are the two axis ends.
        const tip = document.createElement('div')
        tip.className = 'tip'
        tip.hidden = true
        document.body.appendChild(tip)

        node.querySelectorAll('.pt').forEach((g) => {
          g.addEventListener('mouseenter', (e) => {
            const r = rows[Number(g.dataset.i)]
            tip.innerHTML = `<b>${r.day}</b><i>${fmt(r.installs)} active · ${fmt(r.launches)} launches</i>`
            tip.hidden = false
            const box = e.target.getBoundingClientRect()
            tip.style.left = `${Math.min(window.innerWidth - 190, box.left)}px`
            tip.style.top = `${box.top - 8}px`
          })
          g.addEventListener('mouseleave', () => (tip.hidden = true))
        })
      }

      function errors(node, rows) {
        if (rows.length === 0) return void (node.innerHTML = '<p class="empty ok">Nothing reported. Either it is solid or nobody has said yes yet.</p>')
        node.innerHTML = `<table><thead><tr><th>Error</th><th>Kind</th><th class="num">Installs</th><th class="num">Count</th><th class="num">Last seen</th></tr></thead><tbody>
          ${rows
            .map(
              (e) => `<tr>
                <td><details><summary><span class="err">${escapeHtml(e.errorName)}</span> ${escapeHtml(e.message ?? '')}</summary>${
                  e.stack ? `<pre>${escapeHtml(e.stack)}</pre>` : '<p class="sub">No stack.</p>'
                }</details></td>
                <td>${escapeHtml(e.kind ?? '')}</td>
                <td class="num">${fmt(e.installs)}</td>
                <td class="num">${fmt(e.count)}</td>
                <td class="num">${new Date(e.lastSeen).toISOString().slice(0, 10)}</td>
              </tr>`
            )
            .join('')}</tbody></table>`
      }

      const escapeHtml = (s) =>
        String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

      document.querySelectorAll('.range button').forEach((b) =>
        b.addEventListener('click', () => {
          days = Number(b.dataset.days)
          document.querySelectorAll('.range button').forEach((o) => o.setAttribute('aria-pressed', String(o === b)))
          void load()
        })
      )

      void load()
    </script>
  </body>
</html>
